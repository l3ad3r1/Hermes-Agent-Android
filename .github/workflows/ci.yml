name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # llama.cpp is a real git submodule. Without `submodules: recursive` the
      # native build sees an empty app/src/main/cpp/llama.cpp and CMake fails at
      # add_subdirectory — a Kotlin-only run would pass and hide it, so CI must
      # build the APK from a submodule-complete checkout.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The :core:* Gradle projects live in the separate agent-core repo and
      # are mapped in by settings.gradle.kts. Without this checkout Gradle
      # fails during settings evaluation with "projectDirectory does not
      # exist" — which is exactly how every run between the engine split and
      # 2026-08-30 failed. agent-core.ref pins the engine commit so a green
      # run names the engine it was green against.
      #
      # NOTE: the engine is fetched from upstream l3ad3r1/agent-core.
      # agent-core.ref pins the commit that added the remote-gateway
      # settings fields (f939add, merged upstream 2026-09-11) so a green
      # run names the engine it was green against.
      - name: Resolve pinned agent-core ref
        id: engine
        run: |
          REF=$(grep -vE '^\s*(#|$)' agent-core.ref | head -1)
          if [ -z "$REF" ]; then
            echo "::error::agent-core.ref contains no ref"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building against agent-core @ $REF"

      - name: Check out the agent-core engine
        uses: actions/checkout@v4
        with:
          repository: l3ad3r1/agent-core
          ref: ${{ steps.engine.outputs.ref }}
          path: agent-core

      # AGP 9 / Kotlin 2.2 toolchain runs on JDK 21 (repo builds with JBR 21).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The embedded Tailscale node is Go code (tsnet-bridge/) turned into an
      # .aar by gomobile. The .aar is a 14 MB build output and is gitignored, so
      # CI builds it here — app/build.gradle.kts depends on app/libs/tsbridge.aar
      # and Gradle fails without it. gomobile shells out to javac and to the NDK,
      # so this must run after setup-java and with ANDROID_NDK_HOME set.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: tsnet-bridge/go.sum

      - name: Build the tsnet bridge (gomobile)
        run: |
          set -euo pipefail
          # The runner exports ANDROID_HOME/ANDROID_SDK_ROOT itself; naming them in
          # an `env:` block here overrode them with empty strings.
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          # Newest installed NDK; the runner ships at least one.
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          echo "Using NDK $ANDROID_NDK_HOME"
          cd tsnet-bridge
          gomobile init
          gomobile bind -target=android/arm64 -androidapi 29 -o ../app/libs/tsbridge.aar .
          # gomobile can exit 0 after failing to run javac, leaving an empty file.
          test -s ../app/libs/tsbridge.aar

      - name: Test the tsnet bridge
        run: cd tsnet-bridge && go test ./...

      # assembleDebug compiles the llama.cpp native libs (arm64-v8a); Vulkan is
      # off (GGML_VULKAN=OFF in build.gradle.kts), so no host Vulkan SDK is needed.
      - name: Compile and build debug APK
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Unit tests (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Hot-fix smoke check (docs/TINKER-HOTFIX.md). Archives this debug build as a Tinker base,
      # builds a second debug APK against it (-Phermes.tinker.base: same version, aapt2 stable ids)
      # with a different TINKER_ID so its dex differs, and diffs the two with tinker-patch-lib —
      # the same tool and checks the release PC uses. This is where a loader-class violation fails
      # (the Tinker shell referring to a patchable class, or a loader class changing). Unsigned:
      # CI holds no key, and nothing produced here could be installed on a phone.
      - name: Tinker patch smoke check (unsigned)
        run: |
          set -euo pipefail
          BASE=$(tools/tinker/hermes-tinker.sh archive-base --variant debug --archive "$RUNNER_TEMP/tinker-archive")
          cat "$BASE/tinker-base.properties"
          tools/tinker/hermes-tinker.sh build-patch --base "$BASE" --patch-version 1 --unsigned \
            --gradle-arg -Phermes.tinkerId=hermes-ci-smoke-fix --out "$RUNNER_TEMP/tinker-patch"
          unzip -l "$RUNNER_TEMP"/tinker-patch/*-unsigned.apk
          unzip -p "$RUNNER_TEMP"/tinker-patch/*-unsigned.apk assets/package_meta.txt

      - name: Publish test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
