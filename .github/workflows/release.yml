name: Release

# Builds and signs the release APK, verifies the signer, and attaches it to
# the GitHub Release for the pushed tag. Triggered ONLY by a tag push (v*);
# the tag initiator explicitly authorizes this mechanical release build.
#
# Required repo secrets (set these in GitHub Settings -> Secrets and variables
# -> Actions; nothing here or in any agent session ever sees the values):
#   RELEASE_KEYSTORE_BASE64   base64 of hermes-release.jks (`base64 -w0 hermes-release.jks`)
#   RELEASE_KEYSTORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release / upload the asset

jobs:
  # Releases are normally cut by hand: the maintainer runs `gh release create`
  # locally, signing with the keystore that never leaves that machine. That
  # still pushes a tag, which lands here. When the CI signing secrets are not
  # configured this job has nothing to add, so it is *skipped* (not failed) —
  # a red Release run should mean "CI tried to sign and could not", not "the
  # maintainer released the normal way". Populate the four secrets under
  # Settings -> Secrets and variables -> Actions to turn CI signing on.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      can-sign: ${{ steps.check.outputs.can-sign }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] \
            && [ -n "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ] \
            && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] \
            && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "can-sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "can-sign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CI signing secrets not configured — skipping the signed-build job. The tag's release is expected to have been built and uploaded locally with the local keystore."
          fi

  build-sign-release:
    needs: check-secrets
    if: needs.check-secrets.outputs.can-sign == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The :core:* Gradle projects live in the separate agent-core repo and are
      # mapped in by settings.gradle.kts. agent-core.ref pins the engine commit,
      # so the APK attached to a tag is reproducible from two recorded SHAs.
      - name: Resolve pinned agent-core ref
        id: engine
        run: |
          REF=$(grep -vE '^\s*(#|$)' agent-core.ref | head -1)
          if [ -z "$REF" ]; then
            echo "::error::agent-core.ref contains no ref"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building against agent-core @ $REF"

      - name: Check out the agent-core engine
        uses: actions/checkout@v4
        with:
          repository: l3ad3r1/agent-core
          ref: ${{ steps.engine.outputs.ref }}
          path: agent-core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write signing config (from secrets, runner-local only)
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > hermes.local.properties <<EOF
          hermes.signing.storeFile=$RUNNER_TEMP/release.jks
          hermes.signing.storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          hermes.signing.keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          hermes.signing.keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      # Verify the signer before anything ships. Hard-fails the job rather than
      # publishing an APK signed with the wrong (or no) key.
      - name: Verify signer
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::assembleRelease produced no APK"
            exit 1
          fi
          # Pick one apksigner deterministically: the glob can match several
          # installed build-tools versions, and passing all of them turns the
          # extra paths into arguments to the first.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "Checking $APK with $APKSIGNER"

          # An unsigned APK has to fail here rather than downstream: the Gradle
          # config silently omits the signing config when the keystore path is
          # blank, so "assembleRelease succeeded" is not evidence of a signature.
          "$APKSIGNER" verify "$APK"

          # apksigner labels the digest differently across build-tools versions
          # ("Signer #1 certificate SHA-256 digest" up to 34, "V2 Signer:
          # certificate SHA-256 digest" on 35+) and prints one line per
          # signature scheme. Matching either exact label silently yields an
          # empty fingerprint on the other, which then fails the comparison
          # below for the wrong reason - so match only the stable part of the
          # line and require every scheme to agree on one certificate.
          DIGESTS=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -iE 'certificate SHA-256 digest' \
            | awk '{print $NF}' | sort -u)
          COUNT=$(printf '%s\n' "$DIGESTS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected exactly one signing certificate, found $COUNT:"
            printf '%s\n' "$DIGESTS"
            exit 1
          fi
          echo "Signer SHA-256: $DIGESTS"
          if [ "$DIGESTS" != "99255c31ffba1932e4ab2abc12d99b82bf780874b8c686076497157996cf6d6f" ]; then
            echo "::error::Signer mismatch - expected 99255c31..., got $DIGESTS"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Attach APK to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" --title "Hermes $TAG" --generate-notes --latest
          fi
