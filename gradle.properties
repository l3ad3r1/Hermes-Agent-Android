# Hermes Agent — Gradle properties
# Phase 1 (Foundation) of the technical plan.

# --- JVM ---
# com.android.tools.r8.disableHorizontalClassMerging: R8 merges its synthetic helper classes (outlined code,
# lambdas) into one class, and a merged helper refers to app classes. The Tinker loader classes call such
# helpers, so a hot-fix patch of a release crashed at start (docs/TINKER-HOTFIX.md, "R8 and loader
# classes"). Without the merging the helpers stay self-contained. Keep it together with -dontobfuscate in
# app/proguard-rules.pro. A build that does not read this file (for example one with its own jvmargs) is
# caught by hermes-tinker's check before a patch is built.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -Djava.awt.headless=true -Dcom.android.tools.r8.disableHorizontalClassMerging=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
# KSP 2.x (the 2.0.x processor line) is KSP2-only; the legacy KSP1 opt-out was removed.

# --- Hermes version (single source of truth) ---
hermes.versionCode=91
hermes.versionName=1.1.4

# --- Hermes update channel ---
# "owner/repo" of the GitHub Releases channel that ships signed Hermes APKs.
# Blank hides the Updates UI and disables the background check.
hermes.updateRepo=l3ad3r1/Hermes-Agent-Android

# --- Hermes build flags (read by app/build.gradle.kts into BuildConfig) ---
# These are defaults; override in ~/.gradle/gradle.properties or via -P on CLI.
hermes.cloudApiKey=
hermes.cloudBaseUrl=https://api.openai.com/v1
hermes.cloudModel=gpt-4o-mini
hermes.onDeviceModel=hermes-3-8b-q4f16
